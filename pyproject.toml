[project]
name = "lumivox-sttlab"
version = "0.1.0"
description = "Embeddable speech recognition, turn-signal, and trigger components"
authors = [
    {name = "ReanGD", email = "reangd@gmail.com"},
]
requires-python = ">=3.13,<3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "asr",
    "audio",
    "onnx",
    "speech-recognition",
    "speech-to-text",
    "turn-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "lumivox-core @ git+https://github.com/LumivoxAI/core.git@master",
    "numpy>=2,<3",
]

[project.optional-dependencies]
gigaam = ["onnx-asr>=0.12,<0.13"]
tone = ["soxr>=0.5,<1"]
smart-turn = ["numpy==2.3.3", "transformers==4.57.1"]
cpu = ["onnxruntime>=1.24.1,<1.26"]
gpu = ["onnxruntime-gpu>=1.24.1,<1.26"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "nicegui>=3.15,<4",
    "pytest>=9,<10",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = ["model: requires pinned local model artifacts and recordings under data/"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
length-sort = true

[tool.mypy]
files = ["src/lumivox_sttlab", "tests"]
python_version = "3.13"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "soxr", "transformers"]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/LumivoxAI/sttlab"
Documentation = "https://github.com/LumivoxAI/sttlab"
Issues = "https://github.com/LumivoxAI/sttlab/issues"
Source = "https://github.com/LumivoxAI/sttlab"
